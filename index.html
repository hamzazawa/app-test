<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPEC STORE - شحن وبيع حسابات eFootball</title>
    <meta name="description" content="متجر EPEC STORE الأفضل لبيع وشحن حسابات eFootball.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; color: #111827; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 max-w-5xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-black text-gray-900 tracking-wider">EPEC STORE</h1>
            </div>
            
            <div id="ratingWidget" class="flex items-center gap-1.5 bg-gray-50 hover:bg-gray-100 transition px-3 py-1.5 rounded-full border border-gray-200 cursor-pointer shadow-sm hidden">
                <div class="flex text-yellow-400 text-xs">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star-half-stroke"></i>
                </div>
                <span class="text-xs font-black text-gray-800" id="ratingScore">4.9</span>
                <span class="text-[10px] font-bold text-gray-500" id="ratingCount">(1.2k)</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-4 max-w-5xl flex-grow">
        
        <div class="flex justify-center mb-4 mt-2">
            <div class="flex bg-white rounded-xl overflow-hidden border border-gray-200 w-full max-w-2xl shadow-sm text-center">
                <button onclick="filterAccounts('all', this)" class="filter-btn flex-1 py-2.5 text-sm font-bold bg-blue-600 text-white border-l border-blue-600 transition-colors flex justify-center items-center">الكل</button>
                <button onclick="filterAccounts('under100', this)" class="filter-btn flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center">أقل من 100</button>
                <button onclick="filterAccounts('100to300', this)" class="filter-btn flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center">100 - 300</button>
                <button onclick="filterAccounts('over300', this)" class="filter-btn flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 transition-colors flex justify-center items-center">+300 درهم</button>
            </div>
        </div>

        <div id="loadingState" class="flex flex-col items-center justify-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
            <p class="text-sm font-bold text-gray-500">جاري جلب الحسابات المتاحة...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden" id="accountsGrid"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-10">
            <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
            <p class="text-sm font-bold text-gray-500">لا توجد حسابات متاحة في هذا النطاق السعري حالياً.</p>
        </div>

    </main>

    <script>
        const FIREBASE_URL = 'https://hamza-f798c-default-rtdb.firebaseio.com/acc.json';
        let allAccountsData = {}; 

        // 🔥 محاكاة API التقييم
        setTimeout(() => {
            document.getElementById('ratingWidget').classList.remove('hidden');
            // يمكنك تغيير هذه القيم برمجياً لو كان لديك API حقيقي
            document.getElementById('ratingScore').innerText = '4.9';
            document.getElementById('ratingCount').innerText = '(1.8k تقييم)';
        }, 500);

        function parseDateString(dateStr) {
            if (!dateStr) return 0;
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
            }
            return 0;
        }

        async function fetchAccounts() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                if (data) {
                    allAccountsData = data;
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('accountsGrid').classList.remove('hidden');
                    renderAccounts('all'); 
                }
            } catch (error) {
                console.error("خطأ: ", error);
                const loadingElement = document.getElementById('loadingState');
                loadingElement.classList.remove('hidden');
                loadingElement.innerHTML = `<p class="text-red-500 font-bold">حدث خطأ في الاتصال بالخادم.</p>`;
            }
        }

        function registerViewAndRedirect(event, sellerName, accountId, url) {
            event.preventDefault(); 
            fetch('https://serverfirebase.fly.dev/api/increment-view', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seller: sellerName, id: accountId })
            }).catch(e => console.error("View increment failed", e));
            
            window.location.href = url;
        }

        function renderAccounts(filterType) {
            const grid = document.getElementById('accountsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = ''; 
            let hasItems = false;

            let accountsArray = [];
            for (const [id, acc] of Object.entries(allAccountsData)) {
                if (!acc || acc.status !== 'available' || !acc.title) continue; 
                accountsArray.push({ id, ...acc });
            }

            accountsArray.sort((a, b) => parseDateString(b.timestamp) - parseDateString(a.timestamp));
            const now = new Date();

            for (const acc of accountsArray) {
                let priceWeb = parseFloat(acc.price_web) || 0;
                let bankPrice = parseFloat(acc.bank_price) || priceWeb;
                
                if (filterType === 'under100' && priceWeb >= 100) continue;
                if (filterType === '100to300' && (priceWeb < 100 || priceWeb > 300)) continue;
                if (filterType === 'over300' && priceWeb <= 300) continue;

                hasItems = true;

                let rawInwi = priceWeb * 1.25;
                let inwiPrice = Math.round(rawInwi / 5) * 5; 

                let isNew = false;
                if (acc.timestamp) {
                    const accDate = parseDateString(acc.timestamp);
                    const diffInDays = (now.getTime() - accDate) / (1000 * 60 * 60 * 24);
                    if (diffInDays <= 3) {
                        isNew = true;
                    }
                }

                // 🔥 تم التعديل: إرسال price_bot للرابط لاستخدامه في صفحة إتمام الطلب للواتساب
                const checkoutUrl = `checkout.html?id=${acc.id}&title=${encodeURIComponent(acc.title)}&img=${encodeURIComponent(acc.img)}&img2=${encodeURIComponent(acc.img2 || '')}&img3=${encodeURIComponent(acc.img3 || '')}&bank=${bankPrice}&web=${priceWeb}&bot=${acc.price_bot || ''}&gg=${acc.gg}&ios=${acc.ios}&date=${acc.timestamp || ''}`;
                
                let newBadgeRibbon = isNew ? `
                <div class="absolute z-10 w-24 p-0.5 text-center -rotate-45 -left-7 top-3 bg-red-600 text-white text-[9px] font-black shadow-lg uppercase tracking-widest">
                    جديد
                </div>
                ` : '';
                
                let oldPriceHtml = (bankPrice > priceWeb) ? `<del class="text-[10px] text-gray-400 block -mb-1">${bankPrice} MAD</del>` : '';

                // 🔥 تم التعديل: إزالة bg-black وجعل الصورة تملأ المكان بانسجام
                grid.innerHTML += `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 hover:border-blue-400 transition duration-300 flex flex-col shadow-sm relative group">
                    <div class="relative aspect-[16/9] w-full bg-gray-50 overflow-hidden">
                        ${newBadgeRibbon}
                        <div class="absolute inset-0 skeleton"></div>
                        <img src="${acc.img}" 
                             loading="lazy" decoding="async"
                             onload="this.previousElementSibling.style.display='none'" 
                             class="w-full h-full object-cover" 
                             alt="${acc.title}">
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <h3 class="font-bold text-sm mb-4 text-gray-900 line-clamp-2 leading-relaxed">${acc.title}</h3>
                        <div>
                            <div class="flex justify-between items-center bg-blue-50 p-2.5 rounded-lg mb-2 border border-blue-100">
                                <span class="text-blue-700 text-xs font-bold">السعر:</span>
                                <div class="text-left">
                                    ${oldPriceHtml}
                                    <span class="font-black text-blue-700 text-sm">${priceWeb} MAD</span>
                                </div>
                            </div>
                            <div class="flex justify-between items-center bg-purple-50 p-2.5 rounded-lg mb-4 border border-purple-100">
                                <span class="text-purple-700 text-xs font-bold">تعبئة إنوي:</span>
                                <span class="font-black text-purple-700 text-sm">${inwiPrice} MAD</span>
                            </div>
                            <a href="${checkoutUrl}" onclick="registerViewAndRedirect(event, '${acc.seller}', '${acc.key || acc.id}', '${checkoutUrl}')" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition text-sm shadow-md shadow-blue-500/20">
                                شراء الحساب
                            </a>
                        </div>
                    </div>
                </div>`;
            }

            if (!hasItems) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }
        }

        function filterAccounts(filterType, btnElement) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.className = "filter-btn flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center";
            });
            btnElement.className = "filter-btn flex-1 py-2.5 text-sm font-bold bg-blue-600 text-white border-l border-blue-600 transition-colors flex justify-center items-center";
            renderAccounts(filterType);
        }

        window.onload = fetchAccounts;

    </script>
</body>
</html>
