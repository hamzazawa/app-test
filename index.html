<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPEC STORE - شحن وبيع حسابات eFootball</title>
    <meta name="description" content="متجر EPEC STORE الأفضل لبيع وشحن حسابات eFootball.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; color: #111827; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 max-w-5xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-black text-gray-900 tracking-wider">EPEC STORE</h1>
            </div>
            
            <div class="flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <span class="text-xs font-bold text-gray-600"><span id="activeCount">16</span> نشط الآن</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl flex-grow">
        
        <div class="flex justify-center mb-8">
            <div class="flex bg-white rounded-xl overflow-hidden border border-gray-200 w-full max-w-2xl shadow-sm text-center">
                <button onclick="filterAccounts('all', this)" class="filter-btn flex-1 py-3 text-sm font-bold bg-blue-600 text-white border-l border-blue-600 transition-colors flex justify-center items-center">الكل</button>
                <button onclick="filterAccounts('under100', this)" class="filter-btn flex-1 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center">أقل من 100</button>
                <button onclick="filterAccounts('100to300', this)" class="filter-btn flex-1 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center">100 - 300</button>
                <button onclick="filterAccounts('over300', this)" class="filter-btn flex-1 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 transition-colors flex justify-center items-center">+300 درهم</button>
            </div>
        </div>

        <div id="loadingState" class="flex flex-col items-center justify-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
            <p class="text-sm font-bold text-gray-500">جاري جلب الحسابات المتاحة...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden" id="accountsGrid"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-10">
            <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
            <p class="text-sm font-bold text-gray-500">لا توجد حسابات في هذا النطاق السعري حالياً.</p>
        </div>

    </main>

    <script>
        const FIREBASE_URL = 'https://hamza-kr-default-rtdb.firebaseio.com/acc.json';
        let allAccountsData = {}; 

        // دالة تحويل التاريخ (DD-MM-YYYY) إلى قيمة رقمية للترتيب
        function parseDateString(dateStr) {
            if (!dateStr) return 0;
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                // Year, Month (0-based), Day
                return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
            }
            return 0;
        }

        async function fetchAccounts() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                if (data) {
                    allAccountsData = data;
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('accountsGrid').classList.remove('hidden');
                    renderAccounts('all'); 
                }
            } catch (error) {
                console.error("خطأ: ", error);
                document.getElementById('loadingState').innerHTML = `<p class="text-red-500 font-bold">حدث خطأ في الاتصال.</p>`;
            }
        }

        function renderAccounts(filterType) {
            const grid = document.getElementById('accountsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = ''; 
            let hasItems = false;

            let accountsArray = [];
            for (const [id, acc] of Object.entries(allAccountsData)) {
                // استثناء قائمة البوت أو أي حساب بدون عنوان
                if (id === "bot_menu" || !acc.title) continue; 
                accountsArray.push({ id, ...acc });
            }

            // الترتيب من الأحدث إلى الأقدم
            accountsArray.sort((a, b) => parseDateString(b.timestamp) - parseDateString(a.timestamp));

            // جلب تاريخ اليوم بصيغة DD-MM-YYYY للمقارنة
            const today = new Date();
            const todayStr = String(today.getDate()).padStart(2, '0') + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + today.getFullYear();

            for (const acc of accountsArray) {
                // الأسعار من قاعدة البيانات
                let priceWeb = parseFloat(acc.price_web) || 0;
                let bankPrice = parseFloat(acc.bank_price) || priceWeb;
                
                // الفلترة تتم على السعر الأصلي الذي يدفعه الزبون (price_web)
                if (filterType === 'under100' && priceWeb >= 100) continue;
                if (filterType === '100to300' && (priceWeb < 100 || priceWeb > 300)) continue;
                if (filterType === 'over300' && priceWeb <= 300) continue;

                hasItems = true;

                // سعر تعبئة إنوي (25% زيادة على السعر المخفض)
                let inwiPrice = Math.round(priceWeb * 1.25);

                // هل الحساب مضاف اليوم؟
                let isNew = (acc.timestamp === todayStr);

                // رابط الدفع يرسل الأسعار وحالة الروابط
                const checkoutUrl = `checkout.html?id=${acc.id}&title=${encodeURIComponent(acc.title)}&img=${encodeURIComponent(acc.img)}&bank=${bankPrice}&web=${priceWeb}&gg=${acc.gg}&ios=${acc.ios}`;
                
                let newBadge = isNew ? `<div class="absolute top-3 right-3 bg-green-500 text-white text-[10px] font-black px-2.5 py-1 rounded-md shadow-md z-10 animate-pulse"><i class="fa-solid fa-sparkles mr-1 text-[9px]"></i>جديد</div>` : '';
                let oldPriceHtml = (bankPrice > priceWeb) ? `<del class="text-[10px] text-gray-400 block -mb-1">${bankPrice} MAD</del>` : '';

                grid.innerHTML += `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 hover:border-blue-400 transition duration-300 flex flex-col shadow-sm relative group">
                    ${newBadge}
                    <div class="relative h-48 w-full bg-gray-100 overflow-hidden">
                        <img src="${acc.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <h3 class="font-bold text-sm mb-4 text-gray-900 line-clamp-2 leading-relaxed">${acc.title}</h3>
                        <div>
                            <div class="flex justify-between items-center bg-blue-50 p-2.5 rounded-lg mb-2 border border-blue-100">
                                <span class="text-blue-700 text-xs font-bold">السعر:</span>
                                <div class="text-left">
                                    ${oldPriceHtml}
                                    <span class="font-black text-blue-700 text-sm">${priceWeb} MAD</span>
                                </div>
                            </div>
                            <div class="flex justify-between items-center bg-purple-50 p-2.5 rounded-lg mb-4 border border-purple-100">
                                <span class="text-purple-700 text-xs font-bold">تعبئة إنوي:</span>
                                <span class="font-black text-purple-700 text-sm">${inwiPrice} MAD</span>
                            </div>
                            <a href="${checkoutUrl}" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition text-sm shadow-md shadow-blue-500/20">
                                إتمام الطلب
                            </a>
                        </div>
                    </div>
                </div>`;
            }

            if (!hasItems) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }
        }

        function filterAccounts(filterType, btnElement) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.className = "filter-btn flex-1 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 border-l border-gray-200 transition-colors flex justify-center items-center";
            });
            btnElement.className = "filter-btn flex-1 py-3 text-sm font-bold bg-blue-600 text-white border-l border-blue-600 transition-colors flex justify-center items-center";
            renderAccounts(filterType);
        }

        setInterval(() => {
            document.getElementById('activeCount').innerText = Math.floor(Math.random() * (45 - 12 + 1)) + 12;
        }, 8000);

        window.onload = fetchAccounts;

    </script>
</body>
</html>
