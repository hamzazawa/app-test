<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - EPEC STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; color: #111827; scroll-behavior: smooth; }
        .payment-label input:checked + div { border-color: #3b82f6; background-color: #eff6ff; }
        .payment-label input:checked + div .check-circle { background-color: #3b82f6; border-color: #3b82f6; }
        .payment-label input:checked + div .check-circle i { opacity: 1; }
        
        /* إخفاء شريط التمرير العادي */
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* إخفاء شريط التمرير لشريط الروابط فقط ليبقى نظيفاً */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-200 py-4 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 max-w-md flex items-center justify-between">
            <h1 class="text-sm font-black text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-lock text-green-500"></i> إتمام الشراء الآمن
            </h1>
            <a href="index.html" class="text-gray-500 hover:text-gray-800 text-xs font-bold transition flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                <i class="fa-solid fa-arrow-right"></i> إلغاء
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-md flex-grow">
        
        <button onclick="alert('سيتم إضافة الفيديو قريباً!')" class="w-full mb-6 bg-white border border-gray-200 hover:border-blue-400 rounded-xl p-3 flex items-center justify-between transition shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-500">
                    <i class="fa-solid fa-play ml-0.5 text-xs"></i>
                </div>
                <span class="text-sm font-bold text-gray-700">فيديو تعليمي: كيف تشتري من موقعنا؟</span>
            </div>
            <i class="fa-solid fa-chevron-left text-gray-400 text-xs"></i>
        </button>

        <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden mb-8 shadow-sm">
            
            <div class="relative h-48 w-full bg-gray-100 border-b border-gray-200">
                <img id="accImg" src="" alt="Account Image" class="w-full h-full object-cover">
            </div>
            
            <div class="p-4">
                
                <div class="mb-5 w-full overflow-x-auto hide-scroll" dir="ltr">
                    <div class="w-max mx-auto flex items-center justify-center gap-2.5 bg-gray-50 border border-gray-100 px-3 py-2 rounded-lg whitespace-nowrap">
                        <span class="text-[11px] font-black text-blue-600 tracking-wide flex items-center">Links:</span>
                        <span class="flex items-center gap-1 text-[10px] font-bold text-gray-800 font-sans">
                            KONAMI ID <i class="fa-solid fa-check text-green-500 text-[10px]"></i>
                        </span>
                        <span class="text-gray-300 flex items-center">|</span>
                        <span class="flex items-center gap-1 text-[10px] font-bold text-gray-800 font-sans">
                            Google Play <span class="text-red-500 font-black text-[9px]">NO</span>
                        </span>
                        <span class="text-gray-300 flex items-center">|</span>
                        <span class="flex items-center gap-1 text-[10px] font-bold text-gray-800 font-sans">
                            Game Center <span class="text-red-500 font-black text-[9px]">NO</span>
                        </span>
                    </div>
                </div>

                <h2 id="accTitle" class="text-sm font-bold text-gray-900 leading-relaxed mb-4 text-center">جاري التحميل...</h2>
                
                <div class="flex items-center justify-between bg-blue-50 rounded-xl p-3 border border-blue-100 mb-3 shadow-inner">
                    <div class="text-center w-1/2 border-l border-blue-200">
                        <p class="text-[10px] text-blue-600 font-bold mb-1">سعر البنك</p>
                        <p id="baseBankPrice" class="font-black text-lg text-blue-900">0 MAD</p>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="text-[10px] text-blue-600 font-bold mb-1">سعر التعبئة</p>
                        <p id="baseInwiPrice" class="font-black text-lg text-blue-900">0 MAD</p>
                    </div>
                </div>

                <div class="flex items-center justify-center pt-2 mt-1">
                    <div class="text-[11px] font-bold text-gray-500">
                        <span class="text-orange-500" id="viewsCount">80</span> شخص نقر على هذا الحساب
                    </div>
                </div>
            </div>
        </div>

        <div id="payment-section" class="flex items-center justify-between mb-4 px-1 scroll-mt-24">
            <h3 class="text-sm font-black text-gray-800">اختر طريقة الدفع</h3>
            <span class="text-[10px] text-green-600 font-bold bg-green-100 px-2 py-1 rounded border border-green-200">تخفيضات حصرية</span>
        </div>
        
        <div class="space-y-3 mb-8">
            
            <label class="payment-label cursor-pointer block">
                <input type="radio" name="payment_method" value="تحويل بنكي" class="hidden">
                <div class="border border-gray-200 bg-white hover:bg-gray-50 rounded-xl p-3.5 transition flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 shrink-0">
                            <i class="fa-solid fa-building-columns text-lg"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-900">تحويل بنكي</span>
                                <span class="bg-yellow-100 text-yellow-700 text-[10px] font-black px-1.5 py-0.5 rounded border border-yellow-200">-7%</span>
                            </div>
                            <div class="flex items-center gap-1.5 mt-1.5">
                                <img src="https://pbs.twimg.com/media/HGqc0vJXMAAdYt-?format=png&name=small" class="h-3 object-contain">
                                <img src="https://pbs.twimg.com/media/HGqcdtbWcAAheBa?format=png&name=240x240" class="h-3 object-contain">
                                <img src="https://pbs.twimg.com/media/HGqcdttWAAAH6zg?format=png&name=small" class="h-3 object-contain">
                                <img src="https://pbs.twimg.com/media/HGqc0wpWcAAZXQI?format=png&name=small" class="h-3 object-contain">
                                <img src="https://pbs.twimg.com/media/HGqcdtnWIAAUYA_?format=png&name=240x240" class="h-3 object-contain">
                                <span class="text-[9px] font-bold text-blue-600 bg-blue-50 px-1 rounded border border-blue-100">بنك آخر</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-left flex flex-col items-end">
                        <div id="box-bank" class="flex items-center gap-1.5"></div>
                        <div class="w-4 h-4 rounded-full border-2 border-gray-300 flex items-center justify-center mt-1 check-circle transition-colors">
                            <i class="fa-solid fa-check text-[8px] text-white opacity-0 transition-opacity"></i>
                        </div>
                    </div>
                </div>
            </label>

            <label class="payment-label cursor-pointer block">
                <input type="radio" name="payment_method" value="Binance" class="hidden">
                <div class="border border-gray-200 bg-white hover:bg-gray-50 rounded-xl p-3.5 transition flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                            <img src="https://pbs.twimg.com/media/HGqcdt1XwAAwZ8I?format=png&name=small" alt="Binance" class="w-6 h-6 object-contain">
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-900">Binance</span>
                                <span class="bg-yellow-100 text-yellow-700 text-[10px] font-black px-1.5 py-0.5 rounded border border-yellow-200">-4%</span>
                            </div>
                            <div class="text-[9px] text-gray-500 mt-1">الدفع عبر الإرسال لحسابنا (1$ = 10 MAD)</div>
                        </div>
                    </div>
                    <div class="text-left flex flex-col items-end">
                        <div id="box-binance" class="flex items-center gap-1.5"></div>
                        <div class="w-4 h-4 rounded-full border-2 border-gray-300 flex items-center justify-center mt-1 check-circle transition-colors">
                            <i class="fa-solid fa-check text-[8px] text-white opacity-0 transition-opacity"></i>
                        </div>
                    </div>
                </div>
            </label>

            <label class="payment-label cursor-pointer block">
                <input type="radio" name="payment_method" value="وكالة كاش بليس" class="hidden">
                <div class="border border-gray-200 bg-white hover:bg-gray-50 rounded-xl p-3.5 transition flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-yellow-500">
                            <i class="fa-solid fa-money-bill-transfer text-lg"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-900">وكالة Cash Plus</span>
                                <span class="bg-yellow-100 text-yellow-700 text-[10px] font-black px-1.5 py-0.5 rounded border border-yellow-200">-4%</span>
                            </div>
                            <div class="text-[9px] text-gray-500 mt-1">الإرسال نقداً من أي وكالة بالاسم</div>
                        </div>
                    </div>
                    <div class="text-left flex flex-col items-end">
                        <div id="box-cashplus" class="flex items-center gap-1.5"></div>
                        <div class="w-4 h-4 rounded-full border-2 border-gray-300 flex items-center justify-center mt-1 check-circle transition-colors">
                            <i class="fa-solid fa-check text-[8px] text-white opacity-0 transition-opacity"></i>
                        </div>
                    </div>
                </div>
            </label>

            <label class="payment-label cursor-pointer block">
                <input type="radio" name="payment_method" value="تعبئة إنوي" class="hidden">
                <div class="border border-gray-200 bg-white hover:bg-gray-50 rounded-xl p-3.5 transition flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-purple-500">
                            <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-900">تعبئة إنوي (*9)</span>
                                <span class="bg-yellow-100 text-yellow-700 text-[10px] font-black px-1.5 py-0.5 rounded border border-yellow-200">-4%</span>
                            </div>
                            <div class="text-[9px] text-gray-500 mt-1">إدخال رموز التعبئة مباشرة</div>
                        </div>
                    </div>
                    <div class="text-left flex flex-col items-end">
                        <div id="box-inwi" class="flex items-center gap-1.5"></div>
                        <div class="w-4 h-4 rounded-full border-2 border-gray-300 flex items-center justify-center mt-1 check-circle transition-colors">
                            <i class="fa-solid fa-check text-[8px] text-white opacity-0 transition-opacity"></i>
                        </div>
                    </div>
                </div>
            </label>

            <label class="payment-label cursor-pointer block">
                <input type="radio" name="payment_method" value="مباشرة عبر الواتساب" class="hidden">
                <div class="border border-gray-200 bg-white hover:bg-gray-50 rounded-xl p-3.5 transition flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-green-500">
                            <i class="fa-brands fa-whatsapp text-xl"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-gray-900">الشراء عبر واتساب</span>
                                <span class="bg-gray-200 text-gray-600 text-[10px] font-bold px-1.5 py-0.5 rounded border border-gray-300">0%</span>
                            </div>
                            <div class="text-[9px] text-gray-500 mt-1">تواصل مباشر لتأكيد الطلب</div>
                        </div>
                    </div>
                    <div class="text-left flex flex-col items-end">
                        <div id="box-whatsapp" class="flex items-center gap-1.5"></div>
                        <div class="w-4 h-4 rounded-full border-2 border-gray-300 flex items-center justify-center mt-1 check-circle transition-colors">
                            <i class="fa-solid fa-check text-[8px] text-white opacity-0 transition-opacity"></i>
                        </div>
                    </div>
                </div>
            </label>

        </div>

        <div class="sticky bottom-4 z-50 mt-4">
            <button id="submitBtn" onclick="processOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition shadow-lg flex justify-center items-center gap-2 text-sm tracking-wide">
                <span>تأكيد ومتابعة الدفع</span>
                <i class="fa-solid fa-arrow-left mt-0.5"></i>
            </button>
        </div>

    </main>

    <div id="toastNotif" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl opacity-0 transition-opacity duration-300 z-[100] pointer-events-none flex items-center">
        <i id="toastIcon" class="fa-solid fa-check text-green-400 mr-1"></i> <span id="toastMsg" class="mr-1">تم</span>
    </div>

    <script>
        function renderPriceBox(containerId, oldPrice, newPrice, symbol) {
            const container = document.getElementById(containerId);
            if(!container) return;
            if(oldPrice == newPrice) {
                container.innerHTML = `<span class="text-sm font-black text-blue-600">${newPrice} ${symbol}</span>`;
            } else {
                container.innerHTML = `
                    <del class="text-[10px] text-gray-400 ml-1">${oldPrice} ${symbol}</del>
                    <span class="text-sm font-black text-blue-600">${newPrice} ${symbol}</span>
                `;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const accTitle = urlParams.get('title');
        const accImg = urlParams.get('img');
        const originalBankPrice = parseFloat(urlParams.get('bank')) || 0;
        const originalInwiPrice = parseFloat(urlParams.get('inwi')) || 0;

        document.getElementById('viewsCount').innerText = Math.floor(Math.random() * (250 - 40 + 1)) + 40;

        let finalBinanceUsd = 0;

        if(accTitle && originalBankPrice > 0) {
            document.getElementById('accTitle').innerText = accTitle;
            document.getElementById('accImg').src = accImg;
            document.getElementById('baseBankPrice').innerText = originalBankPrice + " MAD";
            document.getElementById('baseInwiPrice').innerText = originalInwiPrice + " MAD";
            
            const pBank = originalBankPrice;
            const pInwi = originalInwiPrice;

            const newBank = Math.round(pBank * 0.93);
            const newCashPlus = Math.round(pBank * 0.96);
            const newInwi = Math.round(pInwi * 0.96);
            const newWhatsapp = pBank;
            
            const oldBinance = (pBank / 10).toFixed(2);
            finalBinanceUsd = ((pBank * 0.96) / 10).toFixed(2);

            renderPriceBox('box-bank', pBank, newBank, 'MAD');
            renderPriceBox('box-binance', oldBinance, finalBinanceUsd, '$');
            renderPriceBox('box-cashplus', pBank, newCashPlus, 'MAD');
            renderPriceBox('box-inwi', pInwi, newInwi, 'MAD');
            renderPriceBox('box-whatsapp', pBank, newWhatsapp, 'MAD'); 

        } else {
            window.location.href = 'index.html';
        }

        function showCustomToast(msg, iconClass) {
            const toast = document.getElementById('toastNotif');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = iconClass;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function processOrder() {
            const methodElement = document.querySelector('input[name="payment_method"]:checked');
            
            if(!methodElement) {
                showCustomToast('المرجو اختيار طريقة الدفع أولاً!', 'fa-solid fa-circle-exclamation text-yellow-400');
                document.getElementById('payment-section').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            
            const method = methodElement.value;
            let finalPriceToPay = 0;
            let priceTextForWa = "";

            if(method === "تحويل بنكي") {
                finalPriceToPay = Math.round(originalBankPrice * 0.93);
                priceTextForWa = finalPriceToPay + " درهم";
            } else if(method === "Binance") {
                finalPriceToPay = finalBinanceUsd; 
                priceTextForWa = "$" + finalPriceToPay;
            } else if(method === "وكالة كاش بليس") {
                finalPriceToPay = Math.round(originalBankPrice * 0.96);
                priceTextForWa = finalPriceToPay + " درهم";
            } else if(method === "تعبئة إنوي") {
                finalPriceToPay = Math.round(originalInwiPrice * 0.96);
                priceTextForWa = finalPriceToPay + " درهم";
            } else {
                finalPriceToPay = originalBankPrice;
                priceTextForWa = finalPriceToPay + " درهم";
            }

            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML; 
            const originalClass = btn.className;

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تجهيز الطلب...';
            btn.classList.replace('bg-blue-600', 'bg-gray-400');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.className = originalClass;

                if(method === "تحويل بنكي" || method === "وكالة كاش بليس" || method === "Binance" || method === "تعبئة إنوي") {
                    window.location.href = `confirm.html?price=${finalPriceToPay}&method=${encodeURIComponent(method)}`;
                } else {
                    const msg = `سلام EPEC STORE،\n\n🛒 *الحساب:* ${accTitle}\n💳 *طريقة الدفع:* ${method}\n💰 *الثمن بعد التخفيض:* ${priceTextForWa}\n\nواش متوفر باش ندفع دابا؟`;
                    window.location.href = `https://wa.me/212663011890?text=${encodeURIComponent(msg)}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
