<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الطلب - EPEC STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; color: #111827; }
        .success-glow { animation: glow 2s infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
            to { box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); }
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen items-center justify-center p-4 relative overflow-hidden">

    <div class="w-full max-w-sm">
        
        <div class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 success-glow ring-8 ring-green-100 border-4 border-white relative">
            <i class="fa-solid fa-check text-4xl text-white"></i>
            <span class="absolute right-0 top-0 flex h-4 w-4">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
              <span class="relative inline-flex rounded-full h-4 w-4 bg-white"></span>
            </span>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-gray-900 mb-2">تم استلام طلبك بنجاح!</h1>
            <p class="text-sm text-gray-500 leading-relaxed">
                سنراجع المعلومات ونرد عليك في الواتساب بسرعة فائقة.
            </p>
        </div>

        <div class="bg-white border border-gray-200 rounded-2xl p-5 mb-6 shadow-sm">
            <h2 class="text-xs font-bold text-gray-500 mb-4 border-b border-gray-100 pb-2">تفاصيل العملية</h2>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500"><i class="fa-solid fa-hashtag mr-1"></i> رقم المرجع:</span>
                    <span id="orderId" class="font-mono font-bold text-blue-600 text-sm">EPEC-XXXX</span>
                </div>
                
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500"><i class="fa-solid fa-users mr-1"></i> ترتيبك في اللائحة:</span>
                    <span class="bg-orange-100 text-orange-600 px-2 py-0.5 rounded font-bold text-xs" id="queueNum">...</span>
                </div>
                
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500"><i class="fa-regular fa-clock mr-1"></i> الوقت المقدر للاستلام:</span>
                    <span class="font-bold text-green-600 text-xs">أقل من 10 دقائق</span>
                </div>
                
                <div class="flex justify-between items-center border-t border-gray-100 pt-3 mt-1">
                    <span class="text-xs text-gray-500">المبلغ المدفوع:</span>
                    <span id="pricePaid" class="font-black text-gray-900 text-sm">0 MAD</span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">طريقة الدفع:</span>
                    <span id="paymentMethod" class="font-bold text-gray-700 text-xs">جاري التحميل</span>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="history.back()" class="w-full bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 font-bold py-3.5 rounded-xl transition flex justify-center items-center gap-2 text-sm shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i> تعديل معلوماتي
            </button>
            
            <a id="whatsappBtn" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-xl transition flex justify-center items-center gap-2 text-sm shadow-lg shadow-green-500/30">
                <i class="fa-brands fa-whatsapp text-lg"></i> تواصل مع الدعم عبر الواتساب
            </a>
            
            <div class="text-center mt-4 pt-2">
                <a href="index.html" class="text-xs font-bold text-blue-600 hover:text-blue-800 transition underline">
                    العودة للصفحة الرئيسية
                </a>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const price = urlParams.get('price');
        const method = urlParams.get('method');
        // 🔥 جلب ترتيب الزبون الفعلي من الرابط الذي أرسلته confirm.html
        const queue = urlParams.get('queue');

        if(orderId && price && method) {
            document.getElementById('orderId').innerText = orderId;
            const symbol = method.includes("Binance") ? "$" : " MAD";
            document.getElementById('pricePaid').innerText = price + symbol;
            document.getElementById('paymentMethod').innerText = method;
            
            document.getElementById('queueNum').innerText = queue ? queue : "1";
            
            // تحديث رسالة الواتساب لتشمل رقم المرجع
            const waMsg = `سلام، أنا صاحب الطلب رقم ${orderId} واش وصلكم الدفع ديالي؟`;
            document.getElementById('whatsappBtn').href = `https://wa.me/212663011890?text=${encodeURIComponent(waMsg)}`;

        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
